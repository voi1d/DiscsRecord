<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato</title>
    <link rel="stylesheet" href="CSS/contato.css" />
    <link
      rel="shortcut icon"
      href="IMG/—Pngtree—retro disco ball silver mirror_18250130.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="IMG/Design sem nome.png" alt="" />

        <div class="logo-name"><a href="index.html">Discs Record</a></div>
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="produtos.html">Produtos</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="promocoes.html">Promoções</a></li>
          <li><a href="contato.html" class="pagina">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="banner">
        <form class="contato">
          <h1>Fale Conosco</h1>

          <div class="formulario">
            <label for="nome">Nome:</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome completo"
              required
            />
          </div>

          <div class="formulario">
            <label for="email">E-mail:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemplo@email.com"
              required
            />
          </div>

          <div class="formulario">
            <label for="telefone">Telefone:</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
            />
          </div>

          <div class="formulario">
            <label for="assunto">Assunto:</label>
            <input
              type="text"
              id="assunto"
              name="assunto"
              placeholder="Sobre o que deseja falar?"
              required
            />
          </div>

          <div class="formulario">
            <label for="mensagem">Mensagem:</label>
            <textarea
              id="mensagem"
              name="mensagem"
              rows="5"
              placeholder="Escreva sua mensagem aqui..."
              required
            ></textarea>
          </div>

          <button type="submit" class="enviar">Enviar</button>
        </form>
      </section>
    </main>
    <footer>© 2026 Discs Record. Todos os direitos reservados.</footer>
  </body>
</html>
